server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

spring:
  # --- Profil par défaut = dev (H2) ---
  profiles:
    active: dev

  # JPA - Jakarta Persistence 3 (Spec 3.1)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 10

  # H2 en mémoire pour dev/test (Spec 3.1)
  datasource:
    url: jdbc:h2:mem:shopflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

# --- Swagger / Springdoc (Spec 3.1 : /swagger-ui) ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# --- JWT (Spec 3.1 : access + refresh) ---
app:
  jwt:
    # Utilise env var en prod - fallback dev uniquement
    secret: ${JWT_SECRET:Y2xlLWRlLWRldi11bmlxdWVtZW50LWEtY2hhbmdlci0wMTIzNDU2Nzg5}
    expiration-ms: 3600000        # 1h access token
    refresh-expiration-ms: 604800000  # 7j refresh token

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.example: INFO

---
# Profil DEV - H2 (par défaut, pas besoin de docker)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:shopflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

---
# Profil PROD - PostgreSQL (Spec 3.1 production)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/shopflow
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:shopflow}
    password: ${DB_PASSWORD:shopflow}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  # Désactive H2 en prod
  h2:
    console:
      enabled: false
